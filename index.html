<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">
        <div class="s1">
            <div class="text-grp">
                <p class="text">Player</p>
                <h1 class="text">0</h1>
            </div>
            <img src="assets/img/player-decorator.png" alt="">
        </div>
        <div class="header">
            <h1>Rock Paper <br> Scissor</h1>
        </div>
        <div class="s2">
            <div class="text-grp">
                <p class="text">Computer</p>
                <h1 class="text">0</h1>
            </div>            
            <img src="assets/img/computer-decorator.png" alt="">
        </div>
        <div class="player">
            
                <div class="item1"><img src="assets/img/rock-stone-cartoon-illustration-isolated-in-white-grass-rock-cartoon-illustration-vector-removebg-preview.png" alt=""></div>
                <div class="item2"><img src="assets/img/paper.png" alt=""></div>
                <div class="item3"><img src="assets/img/sicssor.png" alt=""></div>
            
        </div>
        <div class="vs">
            <h1>vs</h1>
        </div>
        <div class="bot">
            
                <div class="item1"><img src="assets/img/rock-stone-cartoon-illustration-isolated-in-white-grass-rock-cartoon-illustration-vector-removebg-preview.png" alt=""></div>
                <div class="item2"><img src="assets/img/paper.png" alt=""></div>
                <div class="item3"><img src="assets/img/sicssor.png" alt=""></div>
                
        </div>
    </div>
</body>
</html>
